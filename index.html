<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deposit Calculator</title>
  <style>
    :root {
      --text: #111827;
      --muted: #6b7280;
      --border: #d1d5db;
      --primary: #111827;
      --bg: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .container {
      max-width: 760px;
      margin: 48px auto;
      padding: 0 20px 40px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      line-height: 1.2;
    }

    .subtitle {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 15px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      background: #fff;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 14px;
    }

    .inline-note {
      margin: -8px 0 12px;
      color: var(--muted);
      font-size: 12px;
    }

    input[type="number"]:focus {
      outline: 2px solid #bfdbfe;
      outline-offset: 1px;
      border-color: #93c5fd;
    }

    input[type="number"].invalid {
      border-color: #dc2626;
      background: #fef2f2;
    }

    .option-title {
      margin: 2px 0 10px;
      font-weight: 700;
    }

    .options {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 14px;
    }

    .toggle-btn {
      background: #374151;
      font-size: 14px;
      padding: 10px 14px;
    }

    button {
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.92;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error {
      margin-top: 12px;
      color: #b91c1c;
      font-size: 14px;
      min-height: 20px;
    }

    .hint {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .result {
      margin-top: 22px;
      border-top: 1px solid var(--border);
      padding-top: 18px;
      display: none;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px dashed #e5e7eb;
      font-size: 15px;
    }

    .row strong {
      font-size: 17px;
    }

    .total {
      margin-top: 8px;
      border-bottom: none;
      font-weight: 700;
    }

    .result-actions {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .result-actions button {
      background: #1f2937;
      font-size: 14px;
      padding: 10px 14px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 14px;
      background: #111827;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      width: max-content;
      max-width: calc(100vw - 24px);
      text-align: center;
      box-shadow: 0 8px 24px rgba(17, 24, 39, 0.2);
      opacity: 0;
      transform: translate(-50%, 12px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast.success {
      background: #065f46;
    }

    .toast.error {
      background: #991b1b;
    }

    @media (min-width: 768px) {
      .toast {
        left: auto;
        right: 20px;
        bottom: 20px;
        max-width: 360px;
        transform: translateY(10px);
      }

      .toast.show {
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Deposit Calculator</h1>
    <p class="subtitle">房产经纪快速计算押金与相关费用</p>

    <section class="card">
      <label for="rentInput">Monthly Rental (RM)</label>
      <input id="rentInput" type="number" min="0" step="0.01" placeholder="例如 1500" />
      <label for="rentalDepositMonthsInput">Month Rental Deposit</label>
      <input id="rentalDepositMonthsInput" type="number" min="0" step="0.01" value="2" placeholder="例如 2" />
      <label for="advanceRentalMonthsInput">Month advance rental</label>
      <input id="advanceRentalMonthsInput" type="number" min="0" step="0.01" value="1" placeholder="例如 1" />
      <label for="utilitiesDepositMonthsInput">Month Utilities Deposit</label>
      <input id="utilitiesDepositMonthsInput" type="number" min="0" step="0.01" value="0.5" placeholder="例如 0.5" />
      <label for="agreementFeeInput">Agreement Fee (RM)</label>
      <input id="agreementFeeInput" type="number" min="0" step="0.01" value="0" placeholder="例如 200" />
      <p class="inline-note">Please enter your additional agreement amount (excluding stamping cost).</p>
      <p class="hint">Enter monthly rental and month values, then click Calculate.</p>

      <p class="option-title">Detail Language</p>
      <div class="options">
        <button id="languageToggleBtn" class="toggle-btn" type="button">Switch to 中文明细</button>
      </div>

      <button id="calculateBtn" type="button">Calculate</button>
      <p id="errorMsg" class="error"></p>

      <div id="resultPanel" class="result">
        <div class="row"><span id="rentalDepositLabel"></span><span id="rentalDeposit"></span></div>
        <div class="row"><span id="utilitiesLabel"></span><span id="utilities"></span></div>
        <div class="row"><span id="advanceRentalLabel"></span><span id="advanceRental"></span></div>
        <div class="row"><span id="agreementLabel"></span><span id="agreement"></span></div>
        <div class="row total"><strong id="totalLabel"></strong><strong id="total"></strong></div>
        <div class="row total"><strong id="refundableLabel"></strong><strong id="refundable"></strong></div>
        <div class="result-actions">
          <button id="copyBtn" type="button">Copy Result</button>
          <button id="whatsappBtn" type="button">Send via WhatsApp</button>
        </div>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const rentInput = document.getElementById("rentInput");
    const rentalDepositMonthsInput = document.getElementById("rentalDepositMonthsInput");
    const advanceRentalMonthsInput = document.getElementById("advanceRentalMonthsInput");
    const utilitiesDepositMonthsInput = document.getElementById("utilitiesDepositMonthsInput");
    const agreementFeeInput = document.getElementById("agreementFeeInput");
    const errorMsg = document.getElementById("errorMsg");
    const resultPanel = document.getElementById("resultPanel");
    const calculateBtn = document.getElementById("calculateBtn");
    const copyBtn = document.getElementById("copyBtn");
    const whatsappBtn = document.getElementById("whatsappBtn");
    const languageToggleBtn = document.getElementById("languageToggleBtn");
    const toast = document.getElementById("toast");
    let toastTimer = null;
    let useChineseDetails = false;

    function formatRM(value) {
      return new Intl.NumberFormat("en-MY", {
        style: "currency",
        currency: "MYR",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(value);
    }

    function calculateAgreementStamping(monthlyRent) {
      const step1 = monthlyRent * 12;
      const step2 = step1 / 250;
      return step2;
    }

    function formatMonthValue(value) {
      if (Number.isInteger(value)) {
        return String(value);
      }
      return String(Number(value.toFixed(2))).replace(/\.0+$/, "");
    }

    function buildLabels(rentalMonths, utilitiesMonths, advanceMonths) {
      const rentalValue = formatMonthValue(rentalMonths);
      const utilitiesValue = formatMonthValue(utilitiesMonths);
      const advanceValue = formatMonthValue(advanceMonths);
      if (useChineseDetails) {
        return {
          rentalDeposit: `${rentalValue}个月租金押金`,
          utilities: `${utilitiesValue}个月水电押金`,
          advance: `${advanceValue}个月预付租金`,
          agreement: "租赁协议 + 印花税",
          total: "总计",
          refundable: "租约期满后可退还押金"
        };
      }
      return {
        rentalDeposit: `${rentalValue} Month Rental Deposit`,
        utilities: `${utilitiesValue} Month Utilities Deposit`,
        advance: `${advanceValue} Month Advance Rental`,
        agreement: "Agreement + Stamping",
        total: "Total",
        refundable: "Refundable deposit upon tenancy expiry"
      };
    }

    function validateInputs() {
      const monthlyRent = Number(rentInput.value);
      const rentalDepositMonths = Number(rentalDepositMonthsInput.value);
      const advanceRentalMonths = Number(advanceRentalMonthsInput.value);
      const utilitiesDepositMonths = Number(utilitiesDepositMonthsInput.value);
      const agreementFee = Number(agreementFeeInput.value);
      const isValid = Number.isFinite(monthlyRent) && monthlyRent > 0;
      const isRentalDepositMonthsValid = Number.isFinite(rentalDepositMonths) && rentalDepositMonths >= 0;
      const isAdvanceRentalMonthsValid = Number.isFinite(advanceRentalMonths) && advanceRentalMonths >= 0;
      const isUtilitiesDepositMonthsValid = Number.isFinite(utilitiesDepositMonths) && utilitiesDepositMonths >= 0;
      const isAgreementFeeValid = Number.isFinite(agreementFee) && agreementFee >= 0;

      if (
        !isValid ||
        !isRentalDepositMonthsValid ||
        !isAdvanceRentalMonthsValid ||
        !isUtilitiesDepositMonthsValid ||
        !isAgreementFeeValid
      ) {
        errorMsg.textContent = "Please enter valid values (rent > 0, month fields >= 0, agreement fee >= 0).";
        rentInput.classList.add("invalid");
        rentalDepositMonthsInput.classList.add("invalid");
        advanceRentalMonthsInput.classList.add("invalid");
        utilitiesDepositMonthsInput.classList.add("invalid");
        agreementFeeInput.classList.add("invalid");
        calculateBtn.disabled = true;
        resultPanel.style.display = "none";
        return null;
      }

      errorMsg.textContent = "";
      rentInput.classList.remove("invalid");
      rentalDepositMonthsInput.classList.remove("invalid");
      advanceRentalMonthsInput.classList.remove("invalid");
      utilitiesDepositMonthsInput.classList.remove("invalid");
      agreementFeeInput.classList.remove("invalid");
      calculateBtn.disabled = false;
      return { monthlyRent, rentalDepositMonths, advanceRentalMonths, utilitiesDepositMonths, agreementFee };
    }

    function calculate() {
      const values = validateInputs();
      if (values === null) {
        return;
      }
      const { monthlyRent, rentalDepositMonths, advanceRentalMonths, utilitiesDepositMonths, agreementFee } = values;

      calculateBtn.disabled = true;
      const advanceRental = monthlyRent * advanceRentalMonths;
      const rentalDeposit = monthlyRent * rentalDepositMonths;
      const utilitiesDeposit = monthlyRent * utilitiesDepositMonths;

      const agreementStamping = calculateAgreementStamping(monthlyRent) + agreementFee;
      const totalAmount = advanceRental + rentalDeposit + utilitiesDeposit + agreementStamping;
      const refundableDeposit = rentalDeposit + utilitiesDeposit;
      const labels = buildLabels(rentalDepositMonths, utilitiesDepositMonths, advanceRentalMonths);

      document.getElementById("rentalDepositLabel").textContent = labels.rentalDeposit;
      document.getElementById("utilitiesLabel").textContent = labels.utilities;
      document.getElementById("advanceRentalLabel").textContent = labels.advance;
      document.getElementById("agreementLabel").textContent = labels.agreement;
      document.getElementById("totalLabel").textContent = labels.total;
      document.getElementById("refundableLabel").textContent = labels.refundable;
      document.getElementById("rentalDeposit").textContent = formatRM(rentalDeposit);
      document.getElementById("utilities").textContent = formatRM(utilitiesDeposit);
      document.getElementById("advanceRental").textContent = formatRM(advanceRental);
      document.getElementById("agreement").textContent = formatRM(agreementStamping);
      document.getElementById("total").textContent = formatRM(totalAmount);
      document.getElementById("refundable").textContent = formatRM(refundableDeposit);

      resultPanel.style.display = "block";
      calculateBtn.disabled = false;
    }

    function buildResultText() {
      const rows = [
        [document.getElementById("rentalDepositLabel").textContent, document.getElementById("rentalDeposit").textContent],
        [document.getElementById("utilitiesLabel").textContent, document.getElementById("utilities").textContent],
        [document.getElementById("advanceRentalLabel").textContent, document.getElementById("advanceRental").textContent],
        [document.getElementById("agreementLabel").textContent, document.getElementById("agreement").textContent],
        [document.getElementById("totalLabel").textContent, document.getElementById("total").textContent],
        [document.getElementById("refundableLabel").textContent, document.getElementById("refundable").textContent]
      ];
      const lines = [
        `*${rows[0][0]}:*`,
        rows[0][1],
        "",
        `*${rows[1][0]}:*`,
        rows[1][1],
        "___________",
        "",
        `*${rows[2][0]}:*`,
        rows[2][1],
        "",
        `*${rows[3][0]}:*`,
        rows[3][1],
        "___________",
        "",
        `*${rows[4][0]}:*`,
        rows[4][1],
        "",
        `*${rows[5][0]}:*`,
        rows[5][1]
      ];
      return lines.join("\n");
    }

    function toggleDetailLanguage() {
      useChineseDetails = !useChineseDetails;
      languageToggleBtn.textContent = useChineseDetails ? "Switch to English Details" : "Switch to 中文明细";
      if (resultPanel.style.display !== "none") {
        calculate();
      }
    }

    function showToast(message, type = "info") {
      toast.textContent = message;
      toast.className = `toast ${type} show`;
      if (toastTimer) {
        clearTimeout(toastTimer);
      }
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    function fallbackCopyText(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.setAttribute("readonly", "");
      textArea.style.position = "fixed";
      textArea.style.opacity = "0";
      textArea.style.pointerEvents = "none";
      document.body.appendChild(textArea);
      textArea.select();
      const copied = document.execCommand("copy");
      document.body.removeChild(textArea);
      return copied;
    }

    async function copyResult() {
      if (resultPanel.style.display === "none") {
        showToast("Please calculate first.", "error");
        return;
      }
      const text = buildResultText();
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          showToast("Calculation result copied.", "success");
          return;
        }
        if (fallbackCopyText(text)) {
          showToast("Calculation result copied.", "success");
          return;
        }
        showToast("Copy failed. Please copy manually.", "error");
      } catch (error) {
        showToast("Copy failed. Please copy manually.", "error");
      }
    }

    function sendWhatsApp() {
      if (resultPanel.style.display === "none") {
        showToast("Please calculate first.", "error");
        return;
      }
      const text = buildResultText();
      const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
      const newWindow = window.open(url, "_blank");
      if (newWindow) {
        showToast("Opening WhatsApp...", "success");
      } else {
        showToast("Popup blocked. Please allow popups.", "error");
      }
    }

    calculateBtn.addEventListener("click", calculate);
    copyBtn.addEventListener("click", copyResult);
    whatsappBtn.addEventListener("click", sendWhatsApp);
    languageToggleBtn.addEventListener("click", toggleDetailLanguage);
    rentInput.addEventListener("input", validateInputs);
    rentalDepositMonthsInput.addEventListener("input", validateInputs);
    advanceRentalMonthsInput.addEventListener("input", validateInputs);
    utilitiesDepositMonthsInput.addEventListener("input", validateInputs);
    agreementFeeInput.addEventListener("input", validateInputs);
    rentInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !calculateBtn.disabled) {
        calculate();
      }
    });

    validateInputs();
  </script>
</body>
</html>
